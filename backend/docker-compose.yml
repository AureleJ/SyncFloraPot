services:
  api:
    build: .
    container_name: syncflorapot_api
    restart: unless-stopped
    ports:
      - "3000:3000"
    volumes:
      - .:/app
      - /app/node_modules
    env_file: .env
    depends_on:
      db:
        condition: service_healthy
      mqtt:
        condition: service_started
    networks:
      - syncflorapot_network

  db:
    image: timescale/timescaledb:latest-pg17
    container_name: syncflorapot_db
    restart: unless-stopped
    env_file: .env
    environment:
      TS_TUNE_MEMORY: "1GB"
      TS_TUNE_NUM_CPUS: "2"
    ports:
      - "5432:5432"
    volumes:
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql
      - timescale_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "syncflorapot", "-d", "syncflorapot"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - syncflorapot_network

  mqtt:
    image: eclipse-mosquitto:2
    container_name: syncflorapot_mqtt
    restart: unless-stopped
    ports:
      - "1883:1883"
      - "9001:9001"
    volumes:
      - ./mosquitto.conf:/mosquitto/config/mosquitto.conf
      - ./password_file:/mosquitto/config/password_file
      - ./acl_file:/mosquitto/config/acl_file
      - mosquitto_data:/mosquitto/data
      - mosquitto_log:/mosquitto/log
    networks:
      - syncflorapot_network

volumes:
  timescale_data:
  mosquitto_data:
  mosquitto_log:

networks:
  syncflorapot_network:
    driver: bridge
